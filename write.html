<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 | 기록의 온도</title><link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script></head><body><div data-header></div><main><section class="editor-page container"><div class="editor-head"><div><p class="blog-kicker">NEW POST</p><h1>새 글 작성</h1></div><span id="save-state">저장되지 않음</span></div><form class="editor-form" data-form="write"><label><span>카테고리</span><select name="category"><option>개발</option><option>일상</option><option>회고</option></select></label><label><span>제목</span><input name="title" class="title-input" placeholder="제목을 입력하세요" required></label><label><span>요약</span><input name="summary" placeholder="게시글을 한 문장으로 소개하세요" required></label><label><span>태그</span><input name="tags" placeholder="쉼표로 구분해 주세요"></label><label><span>본문</span><textarea name="content" class="content-editor" placeholder="이야기를 시작해 보세요..." required></textarea></label><div class="editor-actions"><button class="button secondary" id="draft-button" type="button">임시 저장</button><button class="button primary" type="submit">게시하기</button></div><p class="form-status" role="status"></p></form></section></main><div data-footer></div></body></html>
