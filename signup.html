<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | 기록의 온도</title><link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script></head><body class="auth-page"><header class="simple-header container"><a class="blog-logo" href="index.html">기록의 온도<span>.</span></a><a href="login.html">이미 계정이 있나요? <b>로그인</b></a></header><main class="auth-main"><section class="auth-card"><p class="blog-kicker">JOIN US</p><h1>회원가입</h1><p class="auth-intro">계정을 만들고 생각을 자유롭게 나눠보세요.</p><form class="app-form" data-form="signup" novalidate><div class="field"><label for="signup-name">이름</label><input id="signup-name" name="name" autocomplete="name" required><small class="error"></small></div><div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><small class="error"></small></div><div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" minlength="8" placeholder="8자 이상 입력하세요" required><small class="error"></small></div><div class="field"><label for="signup-confirm">비밀번호 확인</label><input id="signup-confirm" name="confirm" type="password" required><small class="error"></small></div><label class="check-row"><input type="checkbox" name="terms" required> 이용약관과 개인정보 처리방침에 동의합니다.</label><button class="button primary full" type="submit">계정 만들기</button><p class="form-status" role="status"></p></form></section></main></body></html>
